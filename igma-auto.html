<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGMA Auto — автосервіс в Одесі</title>
<meta name="description" content="IGMA Auto — автосервіс в Одесі: діагностика, ремонт і обслуговування автомобілів.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9E9; --paper:#F4F6F6; --ink:#0F1B26; --muted:#465664; --line:#C3CBCD;
  --accent:#2846F0; --on-accent:#FFFFFF;
  --band:#0C1620; --band-ink:#E9EEF1; --band-muted:#9FB0BD; --band-line:rgba(255,255,255,.14);
  --amber:#FFB000; --red:#FF5A45; --green:#3DDC97; --blue:#7F98FF; --dim:#5D6F7E;
  --font-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-b:"Golos Text",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1118; --paper:#101A24; --ink:#E9EEF1; --muted:#9BAAB6; --line:#24323E;
    --accent:#8AA0FF; --on-accent:#0A1118; --band:#152332;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1118; --paper:#101A24; --ink:#E9EEF1; --muted:#9BAAB6; --line:#24323E;
  --accent:#8AA0FF; --on-accent:#0A1118; --band:#152332;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-b)}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.015em;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:8px;border:2px solid transparent;font:600 1rem/1.2 var(--font-b);text-decoration:none;cursor:pointer;transition:transform .15s ease,background-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:inherit;border-color:currentColor}
.btn-ghost:hover{background:rgba(127,127,127,.14)}
.btn-light{background:#fff;color:#0C1620}
.btn-light:hover{background:#E9EEF1}
.btn-sm{min-height:40px;padding:8px 16px;font-size:.95rem}

/* header */
.top{padding:18px 0}
.top-in{display:flex;align-items:center;gap:24px}
.logo{font:700 1.3rem/1 var(--font-d);letter-spacing:.01em;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.logo-tag{background:var(--accent);color:var(--on-accent);font-weight:500;font-size:.95rem;padding:4px 9px;border-radius:5px;letter-spacing:0}
.nav{display:flex;gap:28px;margin-left:auto}
.nav a{text-decoration:none;font-weight:500;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.top-r{display:flex;align-items:center;gap:12px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .85rem/1 var(--font-b);padding:10px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding:48px 0 88px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start}
.hero h1{font-size:clamp(2rem,4.6vw,3.5rem);line-height:1.08}
.hero h1 span{display:block}
.lead{margin-top:24px;font-size:1.15rem;max-width:34em;color:var(--muted)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

.panel{background:var(--band);border-radius:16px;overflow:hidden;color:var(--band-ink);box-shadow:0 0 0 1px var(--band-line)}
.panel :focus-visible{outline-color:#9DB0FF}
.cluster{padding:22px 22px 26px}
.cluster h2{font-size:1rem;font-weight:600;margin-bottom:16px;color:var(--band-ink)}
.tells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tell{display:grid;justify-items:center;align-content:start;gap:10px;padding:16px 8px 14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;color:var(--band-muted);font:500 .84rem/1.25 var(--font-b);text-align:center;cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.tell .ic{color:var(--dim);transition:color .2s,filter .2s}
.tell:hover{border-color:rgba(255,255,255,.28)}
.tell[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.07);color:#fff}
.tell[aria-pressed="true"] .ic{color:var(--c);filter:drop-shadow(0 0 9px var(--c))}
.ic{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.tells.test .tell .ic{animation:bulb 1.5s ease-out backwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes bulb{
  0%{color:var(--dim);filter:none}
  15%,65%{color:var(--c);filter:drop-shadow(0 0 9px var(--c))}
  100%{color:var(--dim);filter:none}
}

.slip{position:relative;background:var(--paper);color:var(--ink);padding:26px 22px 24px}
.slip::before,.slip::after{content:"";position:absolute;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--bg);z-index:1}
.slip::before{left:-12px}
.slip::after{right:-12px}
.slip-empty{color:var(--muted);min-height:6.4em}
.slip-dl{margin:0;display:grid;gap:14px}
.slip-dl dt{font-size:.85rem;color:var(--muted);font-weight:500}
.slip-dl dd{margin:2px 0 0;font-weight:500}
.slip-note{margin-top:14px;font-size:.88rem;color:var(--muted)}
.slip-form{margin-top:20px;padding-top:20px;border-top:1.5px dashed var(--line)}
.slip-form label{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:6px}
.slip-form textarea{width:100%;resize:vertical;min-height:104px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:400 .98rem/1.5 var(--font-b)}
.slip-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.hint{margin-top:10px;font-size:.85rem;color:var(--muted)}
.status{margin-top:8px;min-height:1.4em;font-size:.9rem;font-weight:500}

/* sections */
.block{padding:88px 0}
.band-paper{background:var(--paper)}
.band-dark{background:var(--band);color:var(--band-ink)}
.band-dark :focus-visible{outline-color:#9DB0FF}
.block h2{font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.15}
.sec-p{margin-top:16px;color:var(--muted);max-width:30em}

.svc-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:64px;align-items:start}
.svc-intro{position:sticky;top:32px}
.svc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc-item{display:grid;grid-template-columns:52px 1fr;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
.svc-ic{width:52px;height:52px;border-radius:12px;background:var(--band);display:grid;place-items:center;color:var(--c)}
.svc-ic .ic{width:28px;height:28px}
.svc-item h3{font-size:1.05rem;line-height:1.3}
.svc-item p{margin-top:6px;color:var(--muted);max-width:36em}

.steps{list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;padding:0;margin:56px 0 0}
.step{counter-increment:s;position:relative;padding-top:30px;border-top:2px solid var(--ink)}
.step::before{content:counter(s);position:absolute;top:-16px;left:0;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:var(--ink);color:var(--bg);font:600 .8rem/1 var(--font-d)}
.step h3{font-size:.98rem;line-height:1.3}
.step p{margin-top:8px;font-size:.95rem;color:var(--muted)}

.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.band-dark .sec-p{color:var(--band-muted)}
.c-rows{margin:0;display:grid;gap:22px}
.c-rows dt{font-size:.85rem;color:var(--band-muted)}
.c-rows dd{margin:4px 0 0;font-size:1.1rem;font-weight:500}
.c-ig{font:600 clamp(1.4rem,3vw,1.9rem)/1.2 var(--font-d);text-decoration:none;overflow-wrap:anywhere}
.c-ig:hover{text-decoration:underline;text-underline-offset:6px}
.c-note{color:var(--band-muted);font-size:.95rem}
.c-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.foot{margin-top:72px;padding-top:24px;border-top:1px solid var(--band-line);color:var(--band-muted);font-size:.9rem}

@media (max-width:960px){
  .nav{display:none}
  .top-r{margin-left:auto}
  .hero{padding-bottom:64px}
  .hero-grid,.svc-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .svc-intro{position:static}
  .block{padding:64px 0}
  .steps{grid-template-columns:1fr;gap:0;margin-top:40px}
  .step{border-top:0;border-left:2px solid var(--ink);padding:0 0 28px 28px}
  .step:last-child{padding-bottom:0}
  .step::before{top:0;left:-16px}
  .step h3{padding-top:4px}
}
@media (max-width:480px){
  body{font-size:16px}
  .tells{grid-template-columns:repeat(2,1fr)}
  .btn{width:100%}
  .top-r .btn{width:auto}
  .cluster,.slip{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important}
  .tells.test .tell .ic{animation:none}
}
</style>

<header class="top">
  <div class="wrap top-in">

</header>

<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1><span>IGMA Auto</span><span data-i18n="h1b"></span></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" id="heroCta" href="#" target="_blank" rel="noopener" data-i18n="btn_ig"></a>
          <a class="btn btn-ghost" href="#services" data-i18n="hero_b2"></a>
        </div>
      </div>

      <div class="panel">
        <div class="cluster">
          <h2 id="panelTitle" data-i18n="panel_title"></h2>
          <div class="tells" id="tells" role="group" aria-labelledby="panelTitle"></div>
        </div>
        <div class="slip">
          <div id="slipBody" aria-live="polite"></div>
          <div class="slip-form">
            <label for="msg" data-i18n="msg_label"></label>
            <textarea id="msg" rows="4"></textarea>
            <div class="slip-actions">
              <a class="btn btn-primary" id="sendBtn" href="#" target="_blank" rel="noopener" data-i18n="btn_ig"></a>
              <a class="btn btn-ghost" id="callBtn" href="#" hidden data-i18n="btn_call"></a>
            </div>
            <p class="status" id="status" role="status"></p>
            <p class="hint" data-i18n="msg_hint"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="block band-paper" id="services">
    <div class="wrap svc-grid">
      <div class="svc-intro">
        <h2 data-i18n="svc_h"></h2>
        <p class="sec-p" data-i18n="svc_p"></p>
      </div>
      <ul class="svc-list" id="svcList"></ul>
    </div>
  </section>

  <section class="block" id="process">
    <div class="wrap">
      <h2 data-i18n="proc_h"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="block band-dark" id="contacts">
    <div class="wrap">
      <div class="contact-grid">
        <div>
          <h2 data-i18n="contact_h"></h2>
          <p class="sec-p" data-i18n="contact_p"></p>
          <div class="c-actions">
            <a class="btn btn-light" id="contactCta" href="#" target="_blank" rel="noopener" data-i18n="btn_ig"></a>
          </div>
        </div>
        <dl class="c-rows" id="cRows"></dl>
      </div>
      <div class="foot" data-i18n="foot"></div>
    </div>
  </section>
</main>

      top_cta:"Написать",
      h1b:"автосервис в Одессе",
      lead:"Диагностика, ремонт и обслуживание автомобилей. Выберите, что вас беспокоит, — и мы подскажем, с чего начать.",
      btn_ig:"Написать в Instagram", hero_b2:"Что мы делаем",
      panel_title:"Что с машиной?",
      slip_empty:"Выберите на панели, что вас беспокоит. Здесь появятся возможные причины и первый шаг.",
      slip_causes:"Возможные причины", slip_first:"С чего начнём",
      slip_note:"Это ориентир, а не диагноз. Точную причину покажет диагностика.",
      msg_label:"Сообщение для чата",
      msg_tpl:"Здравствуйте! Пишу с сайта IGMA Auto.\nАвто (марка, модель, год): \nПроблема: {p}",
      msg_hint:"Кнопка скопирует текст и откроет чат. Вставьте текст в сообщение.",
      copied:"Текст скопирован. Вставьте его в чат Instagram.",
      copy_fail:"Не удалось скопировать. Выделите текст вручную и вставьте в чат.",
      btn_call:"Позвонить",
      sym:{
        check:{label:"Горит Check Engine", causes:"Ошибки в блоке управления двигателем, датчики, зажигание, топливная система.", first:"Компьютерная диагностика: считываем ошибки и живые данные."},
        knock:{label:"Стучит подвеска", causes:"Стойки и опоры, шарниры, втулки стабилизатора, ступичные подшипники.", first:"Осмотр ходовой части, поиск люфтов."},
        brake:{label:"Проблемы с тормозами", causes:"Колодки, диски, суппорты, состояние тормозной жидкости.", first:"Проверка тормозной системы."},
        service:{label:"Пора на ТО", causes:"Масло и фильтры, свечи, технические жидкости, ремни.", first:"Плановое ТО по регламенту для вашей модели."},
        start:{label:"Не заводится", causes:"Аккумулятор, стартер, генератор, топливная система, зажигание.", first:"Диагностика электрики и питания двигателя."},
        other:{label:"Другое", causes:"Опишите, что происходит: когда появляется, на какой скорости, в какую погоду.", first:"Напишите нам — подскажем, с чего начать."}
      },
      svc_h:"Что мы делаем",
      svc_p:"Выберите направление или просто опишите проблему — разберёмся.",
      svc:{
        check:{t:"Компьютерная диагностика", d:"Считываем ошибки и смотрим живые данные, чтобы найти причину, а не просто стереть код."},
        knock:{t:"Ходовая часть", d:"Стойки, рычаги, шарниры, сайлентблоки. Находим стуки, люфты и вибрации."},
        brake:{t:"Тормоза", d:"Колодки, диски, суппорты, тормозная жидкость."},
        service:{t:"Плановое ТО", d:"Масло, фильтры, свечи и жидкости по регламенту производителя."},
        start:{t:"Электрика", d:"Аккумулятор, стартер, генератор, проводка, датчики."},
        other:{t:"Другие неисправности", d:"Не нашли свою проблему? Опишите её в сообщении — скажем, беремся ли и с чего начнём."}
      },
      proc_h:"Как это происходит",
      steps:[
        {t:"Вы пишете нам", d:"Опишите проблему и укажите марку, модель и год авто."},
        {t:"Договариваемся о визите", d:"Подбираем удобное время, когда привезти автомобиль."},
        {t:"Диагностика", d:"Находим причину неисправности."},
        {t:"Согласуем работы", d:"Рассказываем, что нужно сделать и сколько это стоит, до начала ремонта."},
        {t:"Ремонт и выдача", d:"Выполняем работы и возвращаем авто."}
      ],
      contact_h:"Напишите нам",
      contact_p:"Быстрее всего — сообщение в Instagram. Укажите марку, модель и год авто и опишите, что происходит.",
      label_ig:"Instagram", label_phone:"Телефон", label_addr:"Адрес", label_hours:"График работы",
      no_addr:"Адрес и график работы подскажем в ответ на сообщение.",
      foot:"© IGMA Auto, Одесса"
    }
  };

  var $ = function(s){ return document.querySelector(s); };
  var lang = "uk", sel = null, dirty = false;
  try { var saved = localStorage.getItem("igma-lang"); if (saved === "ru" || saved === "uk") lang = saved; } catch(e) {}

  var tellsEl = $("#tells"), msg = $("#msg"), statusEl = $("#status");

  /* индикаторы */
  S.forEach(function(s, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "tell"; b.dataset.id = s.id;
    b.setAttribute("aria-pressed", "false");
    b.style.setProperty("--c", s.color); b.style.setProperty("--i", i);
    b.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#' + s.icon + '"/></svg><span class="tl"></span>';
    b.addEventListener("click", function(){ select(s.id); });
    tellsEl.appendChild(b);
  });

  /* услуги */
  var svcList = $("#svcList");
  S.forEach(function(s){
    var li = document.createElement("li"); li.className = "svc-item";
    li.innerHTML = '<div class="svc-ic" style="--c:' + s.color + '"><svg class="ic" aria-hidden="true"><use href="#' + s.icon + '"/></svg></div>' +
      '<div><h3 data-svc="' + s.id + '"></h3><p data-svcd="' + s.id + '"></p></div>';
    svcList.appendChild(li);
  });

  function select(id){
    tellsEl.classList.remove("test");
    sel = (sel === id) ? null : id;
    tellsEl.querySelectorAll(".tell").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.id === sel));
    });
    renderSlip(); updateMsg(); statusEl.textContent = "";
  }

  function renderSlip(){
    var d = T[lang], box = $("#slipBody");
    if (!sel) { box.innerHTML = '<p class="slip-empty">' + d.slip_empty + '</p>'; return; }
    var s = d.sym[sel];
    box.innerHTML = '<dl class="slip-dl"><div><dt>' + d.slip_causes + '</dt><dd>' + s.causes + '</dd></div>' +
      '<div><dt>' + d.slip_first + '</dt><dd>' + s.first + '</dd></div></dl>' +
      '<p class="slip-note">' + d.slip_note + '</p>';
  }

  function updateMsg(){
    if (dirty) return;
    var d = T[lang];
    msg.value = d.msg_tpl.replace("{p}", sel ? d.sym[sel].label : "");
  }
  msg.addEventListener("input", function(){ dirty = true; });

  function apply(){
    var d = T[lang];
    document.documentElement.lang = lang;
    document.title = d.title;
    document.querySelectorAll("[data-i18n]").forEach(function(e){ e.textContent = d[e.dataset.i18n]; });
    document.querySelectorAll(".tell").forEach(function(b){ b.querySelector(".tl").textContent = d.sym[b.dataset.id].label; });
    document.querySelectorAll("[data-svc]").forEach(function(e){ e.textContent = d.svc[e.dataset.svc].t; });
    document.querySelectorAll("[data-svcd]").forEach(function(e){ e.textContent = d.svc[e.dataset.svcd].d; });
    document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });

    var steps = $("#steps"); steps.innerHTML = "";
    d.steps.forEach(function(s){
      var li = document.createElement("li"); li.className = "step";
      li.innerHTML = "<h3>" + s.t + "</h3><p>" + s.d + "</p>";
      steps.appendChild(li);
    });

    var rows = '<div><dt>' + d.label_ig + '</dt><dd><a class="c-ig" href="' + IG_PROFILE + '" target="_blank" rel="noopener">@' + CONFIG.instagram + '</a></dd></div>';
    if (CONFIG.phone)   rows += '<div><dt>' + d.label_phone + '</dt><dd><a href="tel:' + CONFIG.phone.replace(/[^+\d]/g,"") + '">' + CONFIG.phone + '</a></dd></div>';
    if (CONFIG.address) rows += '<div><dt>' + d.label_addr + '</dt><dd>' + CONFIG.address + '</dd></div>';
    if (CONFIG.hours)   rows += '<div><dt>' + d.label_hours + '</dt><dd>' + CONFIG.hours + '</dd></div>';
    if (!CONFIG.address) rows += '<div><p class="c-note">' + d.no_addr + '</p></div>';
    $("#cRows").innerHTML = rows;

    renderSlip(); updateMsg();
    statusEl.textContent = "";
  }

  /* ссылки на Instagram / телефон */
  ["topCta","heroCta","contactCta"].forEach(function(id){ $("#" + id).href = IG_DM; });
  var sendBtn = $("#sendBtn"); sendBtn.href = IG_DM;
  if (CONFIG.phone) { var c = $("#callBtn"); c.hidden = false; c.href = "tel:" + CONFIG.phone.replace(/[^+\d]/g,""); }

  function copyText(text){
    return new Promise(function(resolve){
      function fallback(){
        try { msg.focus(); msg.select(); resolve(document.execCommand("copy")); }
        catch(e){ resolve(false); }
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function(){ resolve(true); }, fallback);
        } else { fallback(); }
      } catch(e){ fallback(); }
    });
  }
  sendBtn.addEventListener("click", function(){
    var d = T[lang];
    copyText(msg.value).then(function(ok){ statusEl.textContent = ok ? d.copied : d.copy_fail; });
  });

  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.dataset.lang;
      try { localStorage.setItem("igma-lang", lang); } catch(e) {}
      apply();
    });
  });

  apply();

  /* самотест приборной панели при загрузке */
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    tellsEl.classList.add("test");
    setTimeout(function(){ tellsEl.classList.remove("test"); }, 2400);
  }
})();
</script>
</body>
</html>
